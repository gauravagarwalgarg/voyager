version: '3.8'

# Local development infrastructure
# Usage: docker-compose up -d

services:
  # --- Core Infrastructure ---

  postgres:
    image: postgres:16-alpine
    container_name: voyager-postgres
    environment:
      POSTGRES_DB: voyager
      POSTGRES_USER: voyager
      POSTGRES_PASSWORD: voyager-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voyager"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: voyager-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Messaging (NSQ) ---

  nsqlookupd:
    image: nsqio/nsq:latest
    container_name: voyager-nsqlookupd
    command: /nsqlookupd
    ports:
      - "4160:4160"   # TCP
      - "4161:4161"   # HTTP

  nsqd:
    image: nsqio/nsq:latest
    container_name: voyager-nsqd
    command: /nsqd --lookupd-tcp-address=nsqlookupd:4160 --broadcast-address=nsqd
    depends_on:
      - nsqlookupd
    ports:
      - "4150:4150"   # TCP
      - "4151:4151"   # HTTP

  nsqadmin:
    image: nsqio/nsq:latest
    container_name: voyager-nsqadmin
    command: /nsqadmin --lookupd-http-address=nsqlookupd:4161
    depends_on:
      - nsqlookupd
    ports:
      - "4171:4171"   # Web UI

  # --- Observability ---

  prometheus:
    image: prom/prometheus:latest
    container_name: voyager-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - "9091:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: voyager-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
      - tempo

  tempo:
    image: grafana/tempo:latest
    container_name: voyager-tempo
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "3200:3200"   # Tempo HTTP
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./deploy/observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo

volumes:
  postgres-data:
  minio-data:
  prometheus-data:
  grafana-data:
  tempo-data:
