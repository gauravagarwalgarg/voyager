# Voyager Full Local Development Stack
# Usage: docker compose up --build
# Dashboard: http://localhost:8080 (API Gateway + Frontend)

services:
  # ─── Application Services ──────────────────────────────────────────────────────

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
    container_name: voyager-api-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./frontend/dist:/app/frontend/dist:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      nsqd:
        condition: service_started
    environment:
      - POSTGRES_DSN=postgres://voyager:voyager-dev@postgres:5432/voyager?sslmode=disable
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - NSQ_ADDR=nsqd:4150
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    restart: unless-stopped

  image-svc:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: image-svc
    container_name: voyager-image-svc
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - POSTGRES_DSN=postgres://voyager:voyager-dev@postgres:5432/voyager?sslmode=disable
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    restart: unless-stopped

  facts-svc:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: facts-svc
    container_name: voyager-facts-svc
    ports:
      - "50052:50052"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_DSN=postgres://voyager:voyager-dev@postgres:5432/voyager?sslmode=disable
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    restart: unless-stopped

  worker-svc:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: worker-svc
    container_name: voyager-worker-svc
    ports:
      - "50053:50053"
    depends_on:
      nsqd:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      - NSQ_LOOKUPD_ADDR=nsqlookupd:4161
      - NSQ_ADDR=nsqd:4150
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: voyager-frontend
    ports:
      - "3001:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
    restart: unless-stopped

  # ─── Core Infrastructure ───────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: voyager-postgres
    environment:
      POSTGRES_DB: voyager
      POSTGRES_USER: voyager
      POSTGRES_PASSWORD: voyager-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voyager"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: voyager-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Messaging (NSQ) ──────────────────────────────────────────────────────────

  nsqlookupd:
    image: nsqio/nsq:latest
    container_name: voyager-nsqlookupd
    command: /nsqlookupd
    ports:
      - "4160:4160"
      - "4161:4161"

  nsqd:
    image: nsqio/nsq:latest
    container_name: voyager-nsqd
    command: /nsqd --lookupd-tcp-address=nsqlookupd:4160 --broadcast-address=nsqd
    depends_on:
      - nsqlookupd
    ports:
      - "4150:4150"
      - "4151:4151"

  nsqadmin:
    image: nsqio/nsq:latest
    container_name: voyager-nsqadmin
    command: /nsqadmin --lookupd-http-address=nsqlookupd:4161
    depends_on:
      - nsqlookupd
    ports:
      - "4171:4171"

  # ─── Observability ─────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: voyager-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - "9091:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: voyager-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
      - tempo

  tempo:
    image: grafana/tempo:latest
    container_name: voyager-tempo
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./deploy/observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo

volumes:
  postgres-data:
  minio-data:
  prometheus-data:
  grafana-data:
  tempo-data:
